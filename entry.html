<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>事前アンケートのご案内</title>
<style>
* {box-sizing:border-box}
body {margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:clamp(16px,5vw,64px);color:#182f3c;background-color:#fffaf0;background-image:radial-gradient(ellipse at 8% 0%,#f8e4b5 0 28%,transparent 28.2%),radial-gradient(ellipse at 103% 100%,#fae9c6 0 32%,transparent 32.2%);font:400 1.0625rem/1.95 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
main {width:min(100%,42rem);background:#fffefa;border:1px solid #e8d6af;border-radius:1.25rem;padding:clamp(22px,6vw,56px);box-shadow:0 12px 40px #71451a0c}
h1 {margin:0 0 1.1em;color:#743711;font-size:clamp(1.45rem,4.7vw,2.1rem);line-height:1.5}
p {margin:0 0 1em}
.action {display:block;margin:1.8rem auto 0;padding:.82rem 1rem;width:100%;border:0;border-radius:.65rem;background:#793c18;color:white;text-align:center;text-decoration:none;font:inherit;font-weight:700;line-height:1.6;cursor:pointer}
.action:hover {background:#602c0e}
.action:focus-visible {outline:3px solid #18475c;outline-offset:4px}
</style>
</head>
<body>
<main>
<h1>事前アンケートのご案内</h1>
<p>ここからは、ピアハーモニーのサイトを離れ、調査実施会社である株式会社シード・プランニングのページに移動します。</p>
<p>回答は、途中でいつでもやめることができます。<br>ご回答の内容に正解・不正解はありません。</p>
<p>一度進むと回答内容を修正できませんので、質問文をよくお読みのうえ、ご回答ください。</p>
<!-- 公開時は、下のダミーURLを事前アンケートの本番URLに差し替えてください。 -->
<a class="action" href="https://example.com/">調査の事前アンケートに進む</a>
</main>
</body>
</html>
